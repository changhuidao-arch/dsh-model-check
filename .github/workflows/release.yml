name: Validate and release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate
        if: steps.version.outputs.exists != 'true'
        run: |
          python -m pip install -r python/requirements.txt
          npm test
      - name: Pack
        if: steps.version.outputs.exists != 'true'
        run: |
          npm pack --ignore-scripts
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          git archive --format=zip --prefix=dsh-model-check/ -o "dsh-model-check-$version.zip" HEAD
          sha256sum "dsh-model-check-$version.tgz" "dsh-model-check-$version.zip" > SHA256SUMS.txt
      - name: Publish GitHub release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" ./*.tgz ./*.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "DSH 模型指纹 $RELEASE_TAG" --notes-file RELEASE_NOTES.md
